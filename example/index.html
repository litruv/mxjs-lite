<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mxjs-lite Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="title">mxjs-lite Chat</div>
            <div class="header-right">
                <div class="status" id="status">
                    <span class="status-indicator disconnected"></span>
                    <span id="statusText">Disconnected</span>
                </div>
                <button id="disconnectBtn" style="display:none;">Disconnect</button>
            </div>
        </div>

        <!-- 3-column main area -->
        <div class="main">

            <!-- Left: Channel list -->
            <div class="channels-sidebar">
                <div class="sidebar-header">Channels</div>
                <div class="channel-list" id="channelList"></div>
            </div>

            <!-- Center: Chat -->
            <div class="chat-container">
                <div class="topic" id="topic">Not connected</div>

                <div class="messages-wrap" id="messagesWrap">
                    <!-- Global pane shown when no room is active -->
                    <div class="messages" id="globalMessages" style="display:flex;">
                        <div class="system-message">*** Welcome to mxjs-lite chat</div>
                        <div class="system-message">*** Configure server and room below to connect</div>
                    </div>
                </div>

                <div class="input-container">
                    <div class="connection-form" id="connectionForm">
                        <div class="auth-tabs">
                            <button class="tab active" id="tabRegister">Register</button>
                            <button class="tab"        id="tabLogin">Login</button>
                            <button class="tab"        id="tabGuest">Guest</button>
                        </div>
                        <div class="auth-fields">
                            <input type="text"     id="homeserverInput" placeholder="Homeserver" value="https://chat.ruv.wtf">
                            <input type="text"     id="usernameInput"   placeholder="Username">
                            <input type="password" id="passwordInput"   placeholder="Password">
                            <input type="text"     id="roomInput"       placeholder="Room alias (e.g. #test:chat.ruv.wtf)" value="#test:chat.ruv.wtf">
                            <button id="connectBtn">Register &amp; Connect</button>
                        </div>
                    </div>

                    <div class="message-form" id="messageForm" style="display:none;">
                        <input type="file" id="fileInput" accept="image/*" style="display:none;">
                        <button id="uploadBtn" title="Upload image">📎</button>
                        <input type="text" id="messageInput" placeholder="Type a message or /help for commands…" autocomplete="off">
                        <button id="sendBtn">Send</button>
                    </div>
                </div>
            </div>

            <!-- Right: User list -->
            <div class="users-sidebar">
                <div class="sidebar-header">Users</div>
                <div class="user-list" id="userList">
                    <div class="user-count">Not connected</div>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="chat.js"></script>
</body>
</html>
