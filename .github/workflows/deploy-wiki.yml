name: Deploy Documentation to Wiki

# SETUP REQUIRED: Create a Personal Access Token with 'repo' scope and add it as a secret named 'WIKI_TOKEN'
# See .github/WIKI_DEPLOYMENT.md for detailed setup instructions

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy-wiki:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install
        
      - name: Generate documentation
        run: npm run docs:generate
        
      - name: Clone wiki repository
        run: |
          git clone https://x-access-token:${{ secrets.WIKI_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki
          
      - name: Copy documentation to wiki
        run: |
          # Remove old API docs from wiki
          rm -rf wiki/api-generated
          
          # Copy generated docs
          cp -r "mxjs-lite Docs/api-generated" wiki/
          
          # Copy INDEX.md as Home.md if it doesn't exist
          if [ ! -f wiki/Home.md ]; then
            cp "mxjs-lite Docs/api-generated/INDEX.md" wiki/Home.md
          fi
          
      - name: Commit and push to wiki
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update API documentation (auto-generated from ${{ github.sha }})"
            git push
          fi
