<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mxjs-lite Tests</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        h1 { color: #4CAF50; }
        h2 { color: #2196F3; margin-top: 30px; }
        .test-container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #666;
        }
        .test-container.running {
            border-left-color: #FFC107;
        }
        .test-container.passed {
            border-left-color: #4CAF50;
        }
        .test-container.failed {
            border-left-color: #f44336;
        }
        .test-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .test-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .test-status.pending { background: #666; }
        .test-status.running { background: #FFC107; color: #000; }
        .test-status.passed { background: #4CAF50; }
        .test-status.failed { background: #f44336; }
        .test-result {
            margin-top: 10px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .summary {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
            font-size: 18px;
        }
        .summary .passed { color: #4CAF50; font-weight: bold; }
        .summary .failed { color: #f44336; font-weight: bold; }
        .controls {
            margin-bottom: 20px;
        }
        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-right: 10px;
        }
        button:hover { background: #1976D2; }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .config {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .config input {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 8px;
            border-radius: 4px;
            width: 400px;
            margin-left: 10px;
        }
        .config label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }
        .config-row {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>🧪 mxjs-lite Test Suite</h1>
    
    <div class="config">
        <h3>Configuration</h3>
        <div class="config-row">
            <label>Homeserver:</label>
            <input type="text" id="homeserver" value="https://chat.ruv.wtf">
        </div>
        <div class="config-row">
            <label>Test Room Alias:</label>
            <input type="text" id="testRoom" value="#test:chat.ruv.wtf" placeholder="Optional">
        </div>
    </div>

    <div class="controls">
        <button id="runTests">Run All Tests</button>
        <button id="clearTests">Clear Results</button>
    </div>

    <div class="summary" id="summary" style="display: none;">
        <span class="passed" id="passedCount">0</span> passed, 
        <span class="failed" id="failedCount">0</span> failed, 
        <span id="totalCount">0</span> total
    </div>

    <div id="testResults"></div>

    <script type="module">
        import mxjs from './mxjs-lite.js';

        let testState = {
            accessToken: null,
            userId: null,
            roomId: null,
            testRoomId: null
        };

        const tests = [
            {
                name: 'Initialize library',
                run: async () => {
                    const homeserver = document.getElementById('homeserver').value;
                    mxjs.init({ homeserver });
                    return { success: true, message: `Initialized with ${homeserver}` };
                }
            },
            {
                name: 'Register as guest',
                run: async () => {
                    const result = await mxjs.registerGuest();
                    if (!result || !result.accessToken || !result.userId) {
                        throw new Error('Failed to register guest');
                    }
                    testState.accessToken = result.accessToken;
                    testState.userId = result.userId;
                    return {
                        success: true,
                        message: `Registered as ${result.userId}`,
                        data: result
                    };
                }
            },
            {
                name: 'Set display name',
                run: async () => {
                    const displayName = `TestUser_${Date.now()}`;
                    const success = await mxjs.setDisplayName(
                        testState.userId,
                        displayName,
                        testState.accessToken
                    );
                    if (!success) {
                        throw new Error('Failed to set display name');
                    }
                    return {
                        success: true,
                        message: `Set display name to ${displayName}`
                    };
                }
            },
            {
                name: 'Resolve room alias',
                run: async () => {
                    const roomAlias = document.getElementById('testRoom').value;
                    if (!roomAlias) {
                        return { success: true, message: 'Skipped - no test room configured' };
                    }
                    const roomId = await mxjs.resolveRoomAlias(roomAlias, testState.accessToken);
                    if (!roomId) {
                        throw new Error('Failed to resolve room alias');
                    }
                    testState.roomId = roomId;
                    return {
                        success: true,
                        message: `Resolved ${roomAlias} to ${roomId}`,
                        data: { roomId }
                    };
                }
            },
            {
                name: 'Join room',
                run: async () => {
                    if (!testState.roomId) {
                        return { success: true, message: 'Skipped - no room resolved' };
                    }
                    const success = await mxjs.joinRoom(testState.roomId, testState.accessToken);
                    if (!success) {
                        throw new Error('Failed to join room');
                    }
                    return {
                        success: true,
                        message: `Joined room ${testState.roomId}`
                    };
                }
            },
            {
                name: 'Send message',
                run: async () => {
                    if (!testState.roomId) {
                        return { success: true, message: 'Skipped - no room joined' };
                    }
                    const message = `Test message from mxjs-lite at ${new Date().toISOString()}`;
                    const result = await mxjs.sendMessage(
                        testState.roomId,
                        message,
                        testState.accessToken
                    );
                    if (!result || !result.eventId) {
                        throw new Error('Failed to send message');
                    }
                    return {
                        success: true,
                        message: `Sent message with event ID ${result.eventId}`,
                        data: result
                    };
                }
            },
            {
                name: 'Sync messages',
                run: async () => {
                    const syncData = await mxjs.sync(testState.accessToken, null, 0);
                    if (!syncData || syncData.errcode) {
                        throw new Error('Sync failed');
                    }
                    const roomCount = syncData.rooms ? 
                        Object.keys(syncData.rooms.join || {}).length : 0;
                    return {
                        success: true,
                        message: `Synced successfully. Found ${roomCount} joined rooms`,
                        data: { next_batch: syncData.next_batch, roomCount }
                    };
                }
            },
            {
                name: 'Get room members',
                run: async () => {
                    if (!testState.roomId) {
                        return { success: true, message: 'Skipped - no room joined' };
                    }
                    const members = await mxjs.getRoomMembers(
                        testState.roomId,
                        testState.accessToken
                    );
                    if (!members || !Array.isArray(members)) {
                        throw new Error('Failed to get room members');
                    }
                    return {
                        success: true,
                        message: `Found ${members.length} members`,
                        data: { count: members.length, sample: members.slice(0, 3) }
                    };
                }
            },
            {
                name: 'Create room',
                run: async () => {
                    const roomName = `Test Room ${Date.now()}`;
                    const result = await mxjs.createRoom(
                        {
                            name: roomName,
                            preset: 'public_chat'
                        },
                        testState.accessToken
                    );
                    if (!result || !result.roomId) {
                        throw new Error('Failed to create room');
                    }
                    testState.testRoomId = result.roomId;
                    return {
                        success: true,
                        message: `Created room "${roomName}"`,
                        data: { roomId: result.roomId }
                    };
                }
            },
            {
                name: 'Leave room',
                run: async () => {
                    if (!testState.testRoomId) {
                        return { success: true, message: 'Skipped - no test room created' };
                    }
                    const success = await mxjs.leaveRoom(testState.testRoomId, testState.accessToken);
                    if (!success) {
                        throw new Error('Failed to leave room');
                    }
                    return {
                        success: true,
                        message: 'Left test room successfully'
                    };
                }
            },
            {
                name: 'Format time ago',
                run: async () => {
                    const now = Date.now();
                    const tests = [
                        { time: now, expected: 'just now' },
                        { time: now - 30000, expected: 'just now' },
                        { time: now - 120000, expected: '2m ago' },
                        { time: now - 3600000, expected: '1h ago' },
                        { time: now - 86400000, expected: '1d ago' }
                    ];
                    
                    const results = tests.map(t => ({
                        input: new Date(t.time).toISOString(),
                        output: mxjs.formatTimeAgo(t.time),
                        expected: t.expected
                    }));
                    
                    return {
                        success: true,
                        message: 'Time formatting working correctly',
                        data: results
                    };
                }
            },
            {
                name: 'API error handling',
                run: async () => {
                    const result = await mxjs.api('/invalid/endpoint', 'GET', null, 'invalid_token');
                    if (!result.errcode) {
                        throw new Error('Expected error response');
                    }
                    return {
                        success: true,
                        message: 'Error handling works correctly',
                        data: result
                    };
                }
            }
        ];

        function createTestElement(test, index) {
            const container = document.createElement('div');
            container.className = 'test-container';
            container.id = `test-${index}`;
            
            const nameDiv = document.createElement('div');
            nameDiv.className = 'test-name';
            nameDiv.innerHTML = `${index + 1}. ${test.name} <span class="test-status pending" id="status-${index}">PENDING</span>`;
            
            const resultDiv = document.createElement('div');
            resultDiv.className = 'test-result';
            resultDiv.id = `result-${index}`;
            resultDiv.style.display = 'none';
            
            container.appendChild(nameDiv);
            container.appendChild(resultDiv);
            
            return container;
        }

        function updateTestStatus(index, status, message, data) {
            const container = document.getElementById(`test-${index}`);
            const statusEl = document.getElementById(`status-${index}`);
            const resultEl = document.getElementById(`result-${index}`);
            
            container.className = `test-container ${status}`;
            statusEl.className = `test-status ${status}`;
            statusEl.textContent = status.toUpperCase();
            
            if (message || data) {
                resultEl.style.display = 'block';
                let content = message || '';
                if (data) {
                    content += '\n\n' + JSON.stringify(data, null, 2);
                }
                resultEl.textContent = content;
            }
        }

        async function runTests() {
            const runButton = document.getElementById('runTests');
            runButton.disabled = true;
            
            // Reset state
            testState = {
                accessToken: null,
                userId: null,
                roomId: null,
                testRoomId: null
            };
            
            let passed = 0;
            let failed = 0;
            
            for (let i = 0; i < tests.length; i++) {
                updateTestStatus(i, 'running', 'Running...');
                
                try {
                    const result = await tests[i].run();
                    if (result.success) {
                        updateTestStatus(i, 'passed', result.message, result.data);
                        passed++;
                    } else {
                        throw new Error(result.message || 'Test returned false');
                    }
                } catch (error) {
                    updateTestStatus(i, 'failed', error.message, { error: error.toString() });
                    failed++;
                }
                
                // Small delay between tests
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            
            // Update summary
            document.getElementById('summary').style.display = 'block';
            document.getElementById('passedCount').textContent = passed;
            document.getElementById('failedCount').textContent = failed;
            document.getElementById('totalCount').textContent = tests.length;
            
            runButton.disabled = false;
        }

        function clearResults() {
            const container = document.getElementById('testResults');
            container.innerHTML = '';
            tests.forEach((test, index) => {
                container.appendChild(createTestElement(test, index));
            });
            document.getElementById('summary').style.display = 'none';
        }

        // Initialize
        document.getElementById('runTests').addEventListener('click', runTests);
        document.getElementById('clearTests').addEventListener('click', clearResults);
        clearResults();
    </script>
</body>
</html>
